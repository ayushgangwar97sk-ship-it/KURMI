name: Build Secure APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk

          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-33" "build-tools;33.0.1" "platform-tools"

      - name: Prepare HTML & Config
        run: |
          python3 << 'PYCODE'
          import base64, zlib, json, random, string, os, re
          html_b64 = "${{ github.event.client_payload.html_b64 }}"
          try:
              html = zlib.decompress(base64.b64decode(html_b64)).decode('utf-8')
          except:
              html = html_b64
          html = re.sub(r'tg://join\?invite=([a-zA-Z0-9_\-]+)', r'https://t.me/joinchat/\1', html)
          html = re.sub(r'tg:join\?invite=([a-zA-Z0-9_\-]+)', r'https://t.me/joinchat/\1', html)
          app_name = "${{ github.event.client_payload.app_name }}"
          if not app_name or app_name == 'None':
              app_name = 'ZENOX'
          pkg_suffix = random.choice(string.ascii_lowercase) + ''.join(random.choices(string.ascii_lowercase + string.digits, k=7))
          with open('config.json', 'w') as f:
              json.dump({'name': app_name, 'pkg': pkg_suffix, 'chat': "${{ github.event.client_payload.chat_id }}"}, f)
          html_b64_encoded = base64.b64encode(html.encode('utf-8')).decode('ascii')
          with open('html_b64.txt', 'w') as f:
              f.write(html_b64_encoded)
          print(f"✔ App: {app_name} | Package: com.zenox.{pkg_suffix}")
          PYCODE

      - name: Build Secure APK
        run: |
          APP_NAME=$(python3 -c "import json; print(json.load(open('config.json'))['name'])")
          PKG_SUFFIX=$(python3 -c "import json; print(json.load(open('config.json'))['pkg'])")
          PKG_NAME="com.zenox.${PKG_SUFFIX}"
          HTML_B64=$(cat html_b64.txt)

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/$(echo $PKG_NAME | tr '.' '/')
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          # Save HTML directly to assets
          echo "$HTML_B64" | base64 -d > app/src/main/assets/index.html

          cat > app/src/main/AndroidManifest.xml << MANIFEST
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="${APP_NAME}" android:icon="@drawable/ic_launcher" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat > app/src/main/java/${PKG_NAME//.//}/MainActivity.java << JAVAEOF
          package ${PKG_NAME};
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }
              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVAEOF

          cat > app/src/main/res/values/strings.xml << STRINGS
          <resources><string name="app_name">${APP_NAME}</string></resources>
          STRINGS

          cat > app/src/main/res/drawable/ic_launcher.xml << ICON
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle"><solid android:color="#FF6B00" /></shape>
          ICON

          keytool -genkey -v -keystore app/debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          cat > app/build.gradle << APPGRADLE
          apply plugin: 'com.android.application'
          android {
              namespace "${PKG_NAME}"
              compileSdk 33
              defaultConfig {
                  applicationId "${PKG_NAME}"
                  minSdk 21
                  targetSdk 33
              }
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled false
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          APPGRADLE

          cat > settings.gradle << SETTINGS
          rootProject.name = "ZenoxSecure"
          include ':app'
          SETTINGS

          cat > build.gradle << GRADLE
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          cat > gradle.properties << PROP
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROP

      - name: Setup Gradle 8.2
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Build APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Send APK to Telegram
        run: |
          CHAT_ID=$(python3 -c "import json; print(json.load(open('config.json'))['chat'])")
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            curl -s -F "chat_id=${CHAT_ID}" \
                 -F "document=@${APK_PATH}" \
                 -F "caption=✅ Aᴘᴋ Bᴜɪʟᴅ Sᴜᴄᴄᴇssꜰᴜʟʟʏ! 🚀" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          else
            echo "❌ Fᴀɪʟᴇᴅ!" && exit 1
          fi
