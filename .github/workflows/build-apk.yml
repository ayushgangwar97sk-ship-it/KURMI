name: Build Secure APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk

          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-33" "build-tools;33.0.1" "platform-tools"

      - name: Prepare HTML & Config
        run: |
          pip install pycryptodome
          python3 << 'PYCODE'
          import base64, zlib, json, random, string, os, re
          from Crypto.Cipher import AES
          from Crypto.Util.Padding import pad
          from Crypto.Random import get_random_bytes

          html_b64 = "${{ github.event.client_payload.html_b64 }}"
          try:
              html = zlib.decompress(base64.b64decode(html_b64)).decode('utf-8')
          except:
              html = html_b64
          
          # Encrypt HTML
          key = get_random_bytes(32)
          iv = get_random_bytes(16)
          cipher = AES.new(key, AES.MODE_CBC, iv)
          encrypted_html = cipher.encrypt(pad(html.encode('utf-8'), AES.block_size))
          
          with open('enc_html.bin', 'wb') as f:
              f.write(encrypted_html)
          with open('key.txt', 'w') as f:
              f.write(key.hex())
          with open('iv.txt', 'w') as f:
              f.write(iv.hex())

          # User Logo
          logo_b64 = "${{ github.event.client_payload.logo_b64 }}"
          if logo_b64 and len(logo_b64) > 100:
              with open('user_logo.png', 'wb') as f:
                  f.write(base64.b64decode(logo_b64))

          app_name = "${{ github.event.client_payload.app_name }}"
          if not app_name or app_name == 'None':
              app_name = 'ZENOX'
          pkg_suffix = random.choice(string.ascii_lowercase) + ''.join(random.choices(string.ascii_lowercase + string.digits, k=7))
          with open('config.json', 'w') as f:
              json.dump({'name': app_name, 'pkg': pkg_suffix, 'chat': "${{ github.event.client_payload.chat_id }}"}, f)
          print(f"✔ App: {app_name} | Package: com.zenox.{pkg_suffix}")
          PYCODE

      - name: Build Secure APK
        run: |
          APP_NAME=$(python3 -c "import json; print(json.load(open('config.json'))['name'])")
          PKG_SUFFIX=$(python3 -c "import json; print(json.load(open('config.json'))['pkg'])")
          PKG_NAME="com.zenox.${PKG_SUFFIX}"
          KEY=$(cat key.txt)
          IV=$(cat iv.txt)

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/$(echo $PKG_NAME | tr '.' '/')
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi

          mv enc_html.bin app/src/main/assets/enc_html.bin

          if [ -f "user_logo.png" ]; then
            cp user_logo.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

          cat > app/src/main/AndroidManifest.xml << MANIFEST
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="${APP_NAME}" android:icon="@mipmap/ic_launcher" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          cat > app/src/main/java/${PKG_NAME//.//}/MainActivity.java << JAVAEOF
          package ${PKG_NAME};
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import java.io.InputStream;
          import java.io.ByteArrayOutputStream;
          import javax.crypto.Cipher;
          import javax.crypto.spec.SecretKeySpec;
          import javax.crypto.spec.IvParameterSpec;

          public class MainActivity extends Activity {
              private WebView webView;
              private static final String KEY_HEX = "${KEY}";
              private static final String IV_HEX = "${IV}";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);

                  try {
                      InputStream is = getAssets().open("enc_html.bin");
                      ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                      int nRead;
                      byte[] data = new byte[16384];
                      while ((nRead = is.read(data, 0, data.length)) != -1) {
                          buffer.write(data, 0, nRead);
                      }
                      byte[] encryptedData = buffer.toByteArray();

                      SecretKeySpec keySpec = new SecretKeySpec(hexToBytes(KEY_HEX), "AES");
                      IvParameterSpec ivSpec = new IvParameterSpec(hexToBytes(IV_HEX));
                      Cipher cipher = Cipher.getInstance("AES/CBC/PKCS5Padding");
                      cipher.init(Cipher.DECRYPT_MODE, keySpec, ivSpec);
                      
                      byte[] decryptedData = cipher.doFinal(encryptedData);
                      String html = new String(decryptedData, "UTF-8");

                      webView.loadDataWithBaseURL("https://app.local/", html, "text/html", "UTF-8", null);
                  } catch (Exception e) {
                      webView.loadData("<h1>Error loading content</h1>", "text/html", "UTF-8");
                  }
              }

              private byte[] hexToBytes(String hex) {
                  int len = hex.length();
                  byte[] data = new byte[len / 2];
                  for (int i = 0; i < len; i += 2) {
                      data[i / 2] = (byte) ((Character.digit(hex.charAt(i), 16) << 4) + Character.digit(hex.charAt(i+1), 16));
                  }
                  return data;
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVAEOF

          cat > app/src/main/res/values/strings.xml << STRINGS
          <resources><string name="app_name">${APP_NAME}</string></resources>
          STRINGS

          keytool -genkey -v -keystore app/debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

          cat > app/build.gradle << APPGRADLE
          apply plugin: 'com.android.application'
          android {
              namespace "${PKG_NAME}"
              compileSdk 33
              defaultConfig {
                  applicationId "${PKG_NAME}"
                  minSdk 21
                  targetSdk 30
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }
          APPGRADLE

          cat > app/proguard-rules.pro << PROGUARD
          -keep class ${PKG_NAME}.MainActivity { *; }
          -keepclassmembers class ${PKG_NAME}.MainActivity {
              private byte[] hexToBytes(java.lang.String);
          }
          -dontwarn android.webkit.**
          PROGUARD

          cat > settings.gradle << SETTINGS
          rootProject.name = "ZenoxSecure"
          include ':app'
          SETTINGS

          cat > build.gradle << GRADLE
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          cat > gradle.properties << PROP
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          PROP

      - name: Setup Gradle 8.2
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Build APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Send APK to Telegram
        run: |
          CHAT_ID=$(python3 -c "import json; print(json.load(open('config.json'))['chat'])")
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            curl -s -F "chat_id=${CHAT_ID}" \
                 -F "document=@${APK_PATH}" \
                 -F "caption=🛡️ Sᴇᴄᴜʀᴇ APK Bᴜɪʟᴅ Sᴜᴄᴄᴇssꜰᴜʟʟʏ! (Encrypted)\n🔒 Kᴏɪ Cᴏᴅᴇ Dᴇᴄᴏᴅᴇ Nᴀʜɪ Kᴀʀ Sᴀᴋᴛᴀ!" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          else
            echo "❌ Fᴀɪʟᴇᴅ!" && exit 1
          fi
