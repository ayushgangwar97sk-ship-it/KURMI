name: Build Secure APK

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & Accept Licenses
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk

          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "cmake;3.22.1" "ndk;25.2.9519653"

      - name: Prepare HTML & Config
        run: |
          pip install pillow
          python3 << 'PYCODE'
          import base64, zlib, json, random, string, os, re, io
          from PIL import Image

          html_b64 = "${{ github.event.client_payload.html_b64 }}"
          try:
              html = zlib.decompress(base64.b64decode(html_b64)).decode('utf-8')
          except:
              html = html_b64

          html = re.sub(r'tg://join\?invite=([a-zA-Z0-9_\-]+)', r'https://t.me/joinchat/\1', html)
          html = re.sub(r'tg:join\?invite=([a-zA-Z0-9_\-]+)', r'https://t.me/joinchat/\1', html)

          app_name = "${{ github.event.client_payload.app_name }}"
          if not app_name or app_name == 'None':
              app_name = 'ZENOX'

          pkg_suffix = random.choice(string.ascii_lowercase) + ''.join(random.choices(string.ascii_lowercase + string.digits, k=7))
          
          with open('config.json', 'w') as f:
              json.dump({
                  'name': app_name,
                  'pkg': pkg_suffix,
                  'chat': "${{ github.event.client_payload.chat_id }}"
              }, f)

          html_b64_encoded = base64.b64encode(html.encode('utf-8')).decode('ascii')
          with open('html_b64.txt', 'w') as f:
              f.write(html_b64_encoded)

          # ========== LOGO HANDLING ==========
          logo_b64 = "${{ github.event.client_payload.logo_b64 }}"
          has_logo = False

          if logo_b64 and len(logo_b64) > 500:
              try:
                  logo_data = base64.b64decode(logo_b64)
                  img = Image.open(io.BytesIO(logo_data)).convert("RGBA")
                  min_side = min(img.size)
                  left = (img.width - min_side) // 2
                  top = (img.height - min_side) // 2
                  img = img.crop((left, top, left + min_side, top + min_side))

                  sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
                  for density, size in sizes.items():
                      resized = img.resize((size, size), Image.LANCZOS)
                      os.makedirs(f'logo_{density}', exist_ok=True)
                      resized.save(f'logo_{density}/ic_launcher.png', 'PNG')

                  has_logo = True
              except Exception as e:
                  print(f"Logo processing failed: {e}")

          if not has_logo:
              for density, size in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
                  img = Image.new('RGBA', (size, size), (255, 107, 0, 255))
                  os.makedirs(f'logo_{density}', exist_ok=True)
                  img.save(f'logo_{density}/ic_launcher.png', 'PNG')

          print(f"✔ App: {app_name} | Package: com.zenox.{pkg_suffix}")
          PYCODE

      - name: Build Secure APK
        run: |
          APP_NAME=$(python3 -c "import json; print(json.load(open('config.json'))['name'])")
          PKG_SUFFIX=$(python3 -c "import json; print(json.load(open('config.json'))['pkg'])")
          PKG_NAME="com.zenox.${PKG_SUFFIX}"
          
          # XOR Encrypt the HTML for Native Lib
          python3 << 'XOR'
          import base64
          html_b64 = open('html_b64.txt', 'r').read()
          encrypted = ''.join(chr(ord(c) ^ ord('Z')) for c in html_b64)
          encrypted_b64 = base64.b64encode(encrypted.encode('utf-8')).decode('ascii')
          with open('html_enc.txt', 'w') as f:
              f.write(encrypted_b64)
          XOR
          
          HTML_ENC=$(cat html_enc.txt)

          mkdir -p app/src/main/jni
          mkdir -p app/src/main/java/$(echo $PKG_NAME | tr '.' '/')
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi

          cp logo_mdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp logo_hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp logo_xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp logo_xxhdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp logo_xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # ========== NATIVE LIBRARY (XOR ENCRYPTED) ==========
          cat > app/src/main/jni/native-lib.cpp << CPPEOF
          #include <jni.h>
          #include <string>

          std::string xor_decrypt(const std::string& data, char key) {
              std::string result = data;
              for (size_t i = 0; i < result.size(); ++i) {
                  result[i] ^= key;
              }
              return result;
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_${PKG_NAME//./_}_MainActivity_getHTML(JNIEnv *env, jobject thiz) {
              std::string encrypted_html = "${HTML_ENC}";
              std::string decrypted_html = xor_decrypt(encrypted_html, 'Z');
              return env->NewStringUTF(decrypted_html.c_str());
          }

          extern "C" JNIEXPORT jstring JNICALL
          Java_${PKG_NAME//./_}_MainActivity_getCredits(JNIEnv *env, jobject thiz) {
              return env->NewStringUTF(""); 
          }
          CPPEOF

          cat > app/src/main/jni/CMakeLists.txt << CMAKEEOF
          cmake_minimum_required(VERSION 3.22.1)
          project("ZenoxSecure")
          add_library(ZenoxSecure SHARED native-lib.cpp)
          find_library(log-lib log)
          target_link_libraries(ZenoxSecure \${log-lib})
          CMAKEEOF

          # ========== JAVA CODE ==========
          cat > app/src/main/java/${PKG_NAME//.//}/MainActivity.java << JAVAEOF
          package ${PKG_NAME};

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.util.Base64;

          public class MainActivity extends Activity {
              private WebView webView;

              static {
                  System.loadLibrary("ZenoxSecure");
              }

              public native String getHTML();
              public native String getCredits();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  setContentView(webView);

                  try {
                      String html = new String(Base64.decode(getHTML(), Base64.DEFAULT), "UTF-8");
                      webView.loadDataWithBaseURL("https://app.local/", html, "text/html", "UTF-8", null);
                  } catch (Exception e) {
                      webView.loadData("<h1 style='color:red;text-align:center;margin-top:50px;'>Error loading content</h1>", "text/html", "UTF-8");
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          JAVAEOF

          # ========== MANIFEST ==========
          cat > app/src/main/AndroidManifest.xml << MANIFEST
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="${APP_NAME}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST

          # ========== STRINGS ==========
          cat > app/src/main/res/values/strings.xml << STRINGS
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          STRINGS

          # ========== KEYSTORE ==========
          keytool -genkey -v -keystore app/release.keystore \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias zenox -storepass zenox123 -keypass zenox123 \
            -dname "CN=Zenox, OU=Dev, O=Zenox, L=India, ST=India, C=IN"

          # ========== APP BUILD GRADLE (TARGET SDK 34 + RELEASE KEYSTORE) ==========
          cat > app/build.gradle << APPGRADLE
          apply plugin: 'com.android.application'

          android {
              namespace "${PKG_NAME}"
              compileSdk 34

              defaultConfig {
                  applicationId "${PKG_NAME}"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"

                  ndk {
                      abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                  }

                  externalNativeBuild {
                      cmake {
                          cppFlags ""
                      }
                  }
              }

              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "zenox123"
                      keyAlias "zenox"
                      keyPassword "zenox123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/jni/CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }
          }
          APPGRADLE

          # ========== PROGUARD RULES ==========
          cat > app/proguard-rules.pro << PROGUARD
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          -keep class ${PKG_NAME}.MainActivity { *; }
          -keep class android.webkit.** { *; }
          -dontwarn android.webkit.**

          -repackageclasses 'a'
          -allowaccessmodification
          -overloadaggressively
          PROGUARD

          # ========== SETTINGS.GRADLE ==========
          cat > settings.gradle << SETTINGS
          rootProject.name = "ZenoxSecure"
          include ':app'
          SETTINGS

          # ========== BUILD.GRADLE ==========
          cat > build.gradle << GRADLE
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          GRADLE

          # ========== GRADLE.PROPERTIES ==========
          cat > gradle.properties << PROP
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          PROP

      - name: Setup Gradle 8.2
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.2

      - name: Build APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace

      - name: Send APK to Telegram
        run: |
          CHAT_ID=$(python3 -c "import json; print(json.load(open('config.json'))['chat'])")
          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          if [ -f "$APK_PATH" ]; then
            echo "✅ APK found: $(du -h $APK_PATH)"
            curl -s -F "chat_id=${CHAT_ID}" \
                 -F "document=@${APK_PATH}" \
                 -F "caption=🛡️ Secure APK Built Successfully!" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          else
            echo "❌ APK not found!"
            find . -name "*.apk" || true
            exit 1
          fi
